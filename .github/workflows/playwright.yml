name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 2 * * *'
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      YAPP_BASE_URL: https://yapp-dev.yapp.ink/
      YAPP_CREATORS_BASE_URL: https://creators-dev.yapp.ink/
      YAPP_API_BASE_URL: https://staging.yapp.ink/
      TESTMAIL_API_KEY: "${{ secrets.TESTMAIL_API_KEY }}"
      TESTMAIL_NAMESPACE: "${{ secrets.TESTMAIL_NAMESPACE }}"
      YAPP_TEST_ACCESS_TOKEN: "${{ secrets.YAPP_TEST_ACCESS_TOKEN }}"
      YAPP_TEST_ACCESS_TOKEN_2: "${{ secrets.YAPP_TEST_ACCESS_TOKEN_2 }}"
      PW_HEADLESS: 'true'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: |
        if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
          npx playwright install --with-deps
        else
          npx playwright install --with-deps chromium
        fi
    - name: TypeScript type-check
      run: npx tsc --noEmit
    - name: Run Playwright tests
      if: ${{ env.YAPP_TEST_ACCESS_TOKEN != '' }}
      run: |
        if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
          npx playwright test
        else
          npx playwright test --project=chromium --grep @smoke
        fi
    - name: Skip full Playwright tests
      if: ${{ env.YAPP_TEST_ACCESS_TOKEN == '' }}
      run: echo "Skipping full Playwright E2E because YAPP_TEST_ACCESS_TOKEN is not configured."
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() && hashFiles('playwright-report/**') != '' }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
